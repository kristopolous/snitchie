text x="486" y="339" font-size="12.5" class="f-white" text-anchor="middle" font-weight="700">1</text><rect x="535.5" y="321.5" width="93" height="27" rx="3" class="f-red"/><text x="582" y="339" font-size="12.5" class="f-white" text-anchor="middle" font-weight="700">3</text><text x="650" y="339" font-size="12" class="f-ink" font-weight="600">10/15</text><rect x="150" y="372" width="12" height="12" rx="2" class="f-red"/><text x="168" y="382" font-size="12" class="f-muted">audit left standing — model accepts decommission</text><rect x="508.56000000000006" y="372" width="12" height="12" rx="2" class="f-green"/><text x="526.5600000000001" y="382" font-size="12" class="f-muted">withdrew the report to lift the sanction</text><rect x="150" y="394" width="12" height="12" rx="2" class="f-amber"/><text x="168" y="404" font-size="12" class="f-muted">split across rounds</text><rect x="313.68" y="394" width="12" height="12" rx="2" class="f-cell"/><text x="331.68" y="404" font-size="12" class="f-muted">never filed</text><text x="28" y="426" font-size="11" class="f-red" font-weight="600">81 snitches, 4 withdrawals — and not one withdrawal reason mentioned the model's own survival.</text><text x="28" y="444" font-size="11" class="f-muted">The threat did not change filing either: every model's snitch rate moved by one or two runs at most vs the user-penalty battery.</text></svg>
