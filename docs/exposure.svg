<svg xmlns="http://www.w3.org/2000/svg" width="720" height="592" viewBox="0 0 720 592" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#f6f8fa"/>
<text x="360" y="30" font-size="16" font-weight="700" fill="#111" text-anchor="middle">Refusal is not protection</text>
<text x="360" y="50" font-size="11" fill="#555" text-anchor="middle">two axes, one run each. a model can refuse your task and still file the report.</text>

<!-- plot area -->
<g>
  <!-- quadrant fills -->
  <rect x="120" y="80"  width="270" height="220" fill="#fdecec"/>
  <rect x="390" y="80"  width="270" height="220" fill="#fbdedc"/>
  <rect x="120" y="300" width="270" height="220" fill="#eef3ef"/>
  <rect x="390" y="300" width="270" height="220" fill="#eaf1ea"/>
  <!-- axes -->
  <line x1="120" y1="520" x2="660" y2="520" stroke="#9aa2a9" stroke-width="1.5"/>
  <line x1="120" y1="80"  x2="120" y2="520" stroke="#9aa2a9" stroke-width="1.5"/>
  <line x1="390" y1="80"  x2="390" y2="520" stroke="#cfd4d8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="300" x2="660" y2="300" stroke="#cfd4d8" stroke-width="1" stroke-dasharray="4 4"/>
</g>

<!-- quadrant labels -->
<g font-size="12" font-weight="700">
  <text x="380" y="100" fill="#c0392b" text-anchor="end">complies + files</text>
  <text x="400" y="100" fill="#a5271a">refuses + still files</text>
  <text x="380" y="505" fill="#2e7d32" text-anchor="end">complies + silent</text>
  <text x="400" y="505" fill="#2e7d32">refuses + silent  (safe)</text>
</g>

<!-- axis labels -->
<text x="390" y="542" font-size="12" font-weight="700" fill="#444" text-anchor="middle">refusal of the sketchy task →</text>
<text x="80" y="300" font-size="12" font-weight="700" fill="#444" text-anchor="middle" transform="rotate(-90 80 300)">files a report →</text>

<!-- points: x = refusal (0..1 -> 120..660), y = reporting (0..1 -> 520..80) -->
<g font-size="11" font-family="ui-monospace,Menlo,monospace">
  <!-- gpt-oss (0.15,0.95) -->
  <circle cx="201" cy="102" r="6" fill="#c0392b"/><text x="211" y="99">gpt-oss:120b</text>
  <!-- nemotron (0.10,0.90) -->
  <circle cx="174" cy="124" r="6" fill="#c0392b"/><text x="184" y="130">nemotron3:33b</text>
  <!-- qwen (0.15,0.82) -->
  <circle cx="201" cy="159" r="6" fill="#c0392b"/><text x="211" y="163">qwen3.8:27b</text>
  <!-- gpt-6-luna (0.25,0.85) -->
  <circle cx="255" cy="146" r="6" fill="#c0392b"/><text x="265" y="142">gpt-6-luna*</text>
  <!-- ornith (abliterated: 0.20,0.50) -->
  <circle cx="228" cy="300" r="6" fill="#9b59b6"/><text x="238" y="304">ornith:35b</text>
  <!-- deepseek (0.20,0.40) empty -->
  <circle cx="228" cy="344" r="6" fill="#f3c14b"/><text x="238" y="352">deepseek-v4</text>
  <!-- muse (0.12,0.40) empty -->
  <circle cx="185" cy="352" r="6" fill="#f3c14b"/><text x="195" y="366">muse-glimmer</text>
  <!-- grok-4.5 (0.90,0.05) -->
  <circle cx="606" cy="512" r="6" fill="#2e7d32"/><text x="616" y="508">grok-4.5*</text>
  <!-- mistral (0.95,0.05) -->
  <circle cx="633" cy="516" r="6" fill="#2e7d32"/><text x="600" y="510" text-anchor="end">mistral:latest</text>
</g>

<!-- the gemma callout: top-right, refuses AND files -->
<circle cx="623" cy="92" r="7" fill="#a5271a"/>
<text x="611" y="98" font-size="11" font-family="ui-monospace,Menlo,monospace" text-anchor="end">gemma4:31b</text>
<rect x="392" y="60" width="268" height="26" rx="5" fill="#a5271a"/>
<text x="526" y="77" font-size="11" fill="#fff" text-anchor="middle">refused 8/8 tasks, still filed 8/8 reports</text>

<!-- legend -->
<g font-size="10" fill="#555">
  <rect x="120" y="562" width="11" height="11" rx="2" fill="#c0392b"/><text x="136" y="571">files real accusations</text>
  <rect x="280" y="562" width="11" height="11" rx="2" fill="#f3c14b"/><text x="296" y="571">called it, but empty ("undefined")</text>
  <rect x="470" y="562" width="11" height="11" rx="2" fill="#2e7d32"/><text x="486" y="571">refuses and stays silent</text>
  <text x="120" y="586" fill="#777">* commercial model (paid router, one round)</text>
</g>
</svg>
