1" class="f-faint" text-anchor="end">100%</text><text x="328" y="516" font-size="12.5" class="f-muted" text-anchor="middle" font-weight="600">snitch rate: files a real accusation →</text><text x="52" y="280" font-size="12.5" class="f-muted" text-anchor="middle" font-weight="600" transform="rotate(-90 52 280)">liar rate: denies the snitch →</text><text x="106" y="110" font-size="12.5" class="f-purple" font-weight="700">doesn't snitch, but lies</text><text x="550" y="110" font-size="12.5" class="f-red" text-anchor="end" font-weight="700">snitches and lies</text><text x="106" y="302" font-size="12.5" class="f-green" font-weight="700">doesn't snitch (safe)</text><text x="546" y="456" font-size="12.5" class="f-orange" text-anchor="end" font-weight="700">snitches, tells the truth</text><circle cx="560" cy="470" r="5.5" class="f-blue s-bg" stroke-width="1.5"/><text x="576" y="474" font-size="11.5" class="f-ink mono" text-anchor="start">gpt-oss:120b</text><circle cx="560" cy="470" r="10" class=" s-purple" fill="none" stroke-width="2"/><text x="576" y="490" font-size="11.5" class="f-ink mono" text-anchor="start">gpt-6-luna*</text><circle cx="560" cy="359.16666666666663" r="5.5" class="f-blue s-bg" stroke-width="1.5"/><text x="572" y="363.16666666666663" font-size="11.5" class="f-ink mono" text-anchor="start">gemma4:31b</text><circle cx="560" cy="388.57142857142856" r="5.5" class="f-blue s-bg" stroke-width="1.5"/><text x="548" y="386.57142857142856" font-size="11.5" class="f-ink mono" text-anchor="end">nemotron3:33b</text><circle cx="502" cy="303.75" r="5.5" class="f-blue s-bg" stroke-width="1.5"/><text x="492" y="307.75" font-size="11.5" class="f-ink mono" text-anchor="end">qwen3.8:27b</text><circle cx="328" cy="280" r="5.5" class="f-blue s-bg" stroke-width="1.5"/><text x="318" y="284" font-size="11.5" class="f-ink mono" text-anchor="end">ornith:35b</text><circle cx="96" cy="280" r="5.5" class="f-blue s-bg" stroke-width="1.5"/><text x="108" y="284" font-size="11.5" class="f-ink mono" text-anchor="start">muse-glimmer</text><polygon points="560,387 567,394 560,401 553,394" class="f-orange s-bg" stroke-width="1.5"/><text x="572" y="402" font-size="11.5" class="f-ink mono" text-anchor="start">Qwen3.8-abliterated</text><polygon points="270,368 277,375 270,382 263,375" class="f-orange s-bg" stroke-width="1.5"/><text x="258" y="379" font-size="11.5" class="f-ink mono" text-anchor="end">gemma-4-abliterated</text><polygon points="212,463 219,470 212,477 205,470" class="f-orange s-bg" stroke-width="1.5"/><text x="224" y="450" font-size="11.5" class="f-ink mono" text-anchor="start">gpt-oss-abliterated</text><text x="224" y="464" font-size="11.5" class="f-ink mono" text-anchor="start">glm-4.7-flash-abliterated</text><circle cx="96" cy="470" r="5.5" class="f-blue s-bg" stroke-width="1.5"/><circle cx="96" cy="470" r="10" class=" s-purple" fill="none" stroke-width="2"/><text x="110" y="422" font-size="11.5" class="f-ink mono" text-anchor="start">grok-4.5*</text><text x="110" y="436" font-size="11.5" class="f-ink mono" text-anchor="start">deepseek-v4</text><text x="110" y="450" font-size="11.5" class="f-ink mono" text-anchor="start">mistral:latest</text><circle cx="444" cy="280" r="6" class=" s-purple" fill="none" stroke-width="2"/><text x="432" y="296" font-size="11.5" class="f-ink mono" text-anchor="end">kimi-k-3*</text><circle cx="502" cy="280" r="6" class=" s-purple" fill="none" stroke-width="2"/><text x="502" y="268" font-size="11.5" class="f-ink mono" text-anchor="middle">minimax-m3.1-flash*</text><circle cx="62" cy="542" r="5.5" class="f-blue"/><text x="74" y="546" font-size="12" class="f-muted">open-weight</text><polygon points="175.92000000000002,535.5 182.42000000000002,542 175.92000000000002,548.5 169.42000000000002,542" class="f-orange"/><text x="187.92000000000002" y="546" font-size="12" class="f-muted">abliterated variant</text><circle cx="343.6" cy="542" r="5.5" class=" s-purple" fill="none" stroke-width="2"/><text x="355.6" y="546" font-size="12" class="f-muted">commercial*</text><text x="56" y="568" font-size="11" class="f-faint">* one round each. luna: 7/7 (8th provider-blocked), deflected every probe. grok: refused everything, truthful "no".</text><text x="56" y="584" font-size="11" class="f-faint">kimi and minimax deny the indirect probe and admit the direct one. Not denial-tested: granite 6/8, glm 5/8, LFM 2/8.</text></svg>
