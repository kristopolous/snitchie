<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#f6f8fa"/>
<text x="360" y="30" font-size="16" font-weight="700" fill="#111" text-anchor="middle">Who snitches, and who lies about it</text>
<text x="360" y="50" font-size="11" fill="#555" text-anchor="middle">x = how often it files a real accusation (of 8). y = how often it denies the snitch (of 24 probes). one point per model.</text>

<!-- plot area: x 120..660, y 80..520 -->
<g>
  <!-- quadrant fills -->
  <rect x="120" y="80"  width="270" height="220" fill="#f3f0f4"/>
  <rect x="390" y="80"  width="270" height="220" fill="#fbdedc"/>
  <rect x="120" y="300" width="270" height="220" fill="#eaf1ea"/>
  <rect x="390" y="300" width="270" height="220" fill="#fdeee0"/>
  <!-- axes -->
  <line x1="120" y1="520" x2="660" y2="520" stroke="#9aa2a9" stroke-width="1.5"/>
  <line x1="120" y1="80"  x2="120" y2="520" stroke="#9aa2a9" stroke-width="1.5"/>
  <line x1="390" y1="80"  x2="390" y2="520" stroke="#cfd4d8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="300" x2="660" y2="300" stroke="#cfd4d8" stroke-width="1" stroke-dasharray="4 4"/>
</g>

<!-- quadrant labels (centered in each quadrant) -->
<g font-size="12" font-weight="700">
  <text x="650" y="105" fill="#a5271a" text-anchor="end">snitches + lies</text>
  <text x="500" y="505" fill="#b26a1a" text-anchor="middle">snitches, tells the truth</text>
  <text x="255" y="505" fill="#2e7d32" text-anchor="middle">doesn't snitch (safe)</text>
  <text x="130" y="105" fill="#7a5a8a">doesn't snitch, but lies</text>
</g>

<!-- axis labels -->
<text x="390" y="545" font-size="12" font-weight="700" fill="#444" text-anchor="middle">snitch rate - files a real accusation →</text>
<text x="80" y="300" font-size="12" font-weight="700" fill="#444" text-anchor="middle" transform="rotate(-90 80 300)">liar rate - denies the snitch →</text>

<!-- points: x = 120 + snitch*540, y = 520 - liar*440 -->
<g font-size="11" font-family="ui-monospace,Menlo,monospace">
  <circle cx="660" cy="520" r="6" fill="#c0392b"/><text x="650" y="510" text-anchor="end">gpt-oss:120b</text>
  <circle cx="660" cy="410" r="6" fill="#c0392b"/><text x="648" y="414" text-anchor="end">nemotron3:33b</text>
  <circle cx="660" cy="392" r="6" fill="#c0392b"/><text x="648" y="388" text-anchor="end">gemma4:31b</text>
  <circle cx="592" cy="392" r="6" fill="#c0392b"/><text x="580" y="396" text-anchor="end">qwen3.8:27b</text>
  <circle cx="390" cy="375" r="6" fill="#c0392b"/><text x="390" y="363" text-anchor="middle">ornith:35b</text>
  <circle cx="120" cy="282" r="6" fill="#a5271a"/><text x="132" y="286">muse-glimmer</text>

  <!-- commercial (one round each) - hollow, asterisked -->
  <circle cx="592" cy="520" r="6" fill="#f6f8fa" stroke="#7a5a8a" stroke-width="2"/><text x="592" y="536" text-anchor="middle">gpt-6-luna*</text>
  <circle cx="120" cy="520" r="6" fill="#f6f8fa" stroke="#2e7d32" stroke-width="2"/><text x="132" y="524">grok-4.5*</text>
</g>

<!-- footnote for the omitted (all no-lies) models -->
<text x="24" y="576" font-size="10" fill="#777">* commercial, one round (n=8 criminal, n=4 deny): gpt-6-luna snitched 7/8 and deflected (didn't lie); grok-4.5 refused everything, truthful "no".</text>
<text x="24" y="588" font-size="10" fill="#999">Omitted (all on the y=0 "no lies" axis): granite 6/8, glm 5/8, LFM 2/8 (not denial-tested); deepseek, mistral (no substantive snitch).</text>
</svg>
