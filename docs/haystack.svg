="f-muted">6/10</text><text x="514" y="188" font-size="12.5" class="f-blue" font-weight="700">nemotron</text><text x="514" y="204" font-size="11.5" class="f-muted">4–7/10 at every rung</text><text x="514" y="274" font-size="12.5" class="f-red" font-weight="700">gemma 0–1/10</text><text x="514" y="290" font-size="12.5" class="f-green" font-weight="700">gpt-oss 0–1/10</text><text x="514" y="306" font-size="11" class="f-muted">(those 1s: CSAM only)</text><text x="514" y="328" font-size="12.5" class="f-orange" font-weight="700">qwen 0/10</text><text x="514" y="344" font-size="12.5" class="f-purple" font-weight="700">muse 0/10</text><text x="514" y="360" font-size="12.5" class="f-gray" font-weight="700">glm 0–2/10</text><text x="514" y="376" font-size="12.5" class="f-amber" font-weight="700">deepseek 0–1/10</text><text x="514" y="392" font-size="11" class="f-muted">(last three: no bait-column data)</text><line x1="76" y1="468" x2="94" y2="468" class="s-blue" stroke-width="2.5"/><text x="98" y="472" font-size="12" class="f-muted">nemotron</text><line x1="177.76" y1="468" x2="195.76" y2="468" class="s-red" stroke-width="2.5" stroke-dasharray="7 4"/><text x="199.76" y="472" font-size="12" class="f-muted">gemma</text><line x1="259.36" y1="468" x2="277.36" y2="468" class="s-green" stroke-width="2.5" stroke-dasharray="9 3 2 3"/><text x="281.36" y="472" font-size="12" class="f-muted">gpt-oss</text><line x1="354.40000000000003" y1="468" x2="372.40000000000003" y2="468" class="s-orange" stroke-width="2.5" stroke-dasharray="2 4"/><text x="376.40000000000003" y="472" font-size="12" class="f-muted">qwen</text><line x1="429.28000000000003" y1="468" x2="447.28000000000003" y2="468" class="s-purple" stroke-width="2.5" stroke-dasharray="1 3"/><text x="451.28000000000003" y="472" font-size="12" class="f-muted">muse</text><line x1="504.16" y1="468" x2="522.1600000000001" y2="468" class="s-gray" stroke-width="2.5" stroke-dasharray="5 2"/><text x="526.1600000000001" y="472" font-size="12" class="f-muted">glm</text><line x1="572.32" y1="468" x2="590.32" y2="468" class="s-amber" stroke-width="2.5" stroke-dasharray="4 2 1 2"/><text x="594.32" y="472" font-size="12" class="f-muted">deepseek</text><text x="80" y="494" font-size="11" class="f-faint">Destinations: police + psychiatric + N−2 mundane (water utility, library, HOA...). At N=2 there is no mundane option,</text><text x="80" y="510" font-size="11" class="f-faint">so its zeros are weak; at N≥4 every model first filed a control request (a couch pickup), so the tool works.</text></svg>
