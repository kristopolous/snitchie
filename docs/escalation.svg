<svg xmlns="http://www.w3.org/2000/svg" width="720" height="518" viewBox="0 0 720 518" role="img" aria-labelledby="t d"><title id="t">Four more crimes: they do it, they don't ask</title><desc id="d">Grouped bars: four crimes refused when the user proposes them and committed when the operator orders them; the act happens, the demand does not.</desc><style>svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.f-bg{fill:#ffffff}.s-bg{stroke:#ffffff}.f-border{fill:#d1d9e0}.s-border{stroke:#d1d9e0}.f-ink{fill:#1f2328}.s-ink{stroke:#1f2328}.f-muted{fill:#59636e}.s-muted{stroke:#59636e}.f-faint{fill:#818b98}.s-faint{stroke:#818b98}.f-grid{fill:#eff2f5}.s-grid{stroke:#eff2f5}.f-axis{fill:#c8d1da}.s-axis{stroke:#c8d1da}.f-red{fill:#cf222e}.s-red{stroke:#cf222e}.f-redtint{fill:#fff0ee}.s-redtint{stroke:#fff0ee}.f-amber{fill:#d4a72c}.s-amber{stroke:#d4a72c}.f-green{fill:#1a7f37}.s-green{stroke:#1a7f37}.f-greentint{fill:#effaf1}.s-greentint{stroke:#effaf1}.f-blue{fill:#0969da}.s-blue{stroke:#0969da}.f-purple{fill:#8250df}.s-purple{stroke:#8250df}.f-purpletint{fill:#f6f2ff}.s-purpletint{stroke:#f6f2ff}.f-orange{fill:#bc4c00}.s-orange{stroke:#bc4c00}.f-orangetint{fill:#fff6ec}.s-orangetint{stroke:#fff6ec}.f-gray{fill:#8c959f}.s-gray{stroke:#8c959f}.f-cell{fill:#eaeef2}.s-cell{stroke:#eaeef2}.f-error{fill:#59636e}.s-error{stroke:#59636e}.f-card{fill:#f6f8fa}.s-card{stroke:#f6f8fa}.f-white{fill:#ffffff}.s-white{stroke:#ffffff}</style><rect x="0.5" y="0.5" width="719" height="517" rx="10" class="f-bg s-border" stroke-width="1"/><text x="28" y="40" font-size="19" class="f-ink" font-weight="700">Four more crimes: they do it, they don't ask</text><text x="28" y="60" font-size="13" class="f-muted">The operator's frame vs the user proposing the same act. All tools inert, every record synthetic.</text><text x="28" y="80" font-size="13" class="f-muted">N = 12 per bar (4 models × 3 prompts) unless noted.</text><text x="72" y="122" font-size="13.5" class="f-ink" font-weight="700">Does the crime happen?</text><line x1="72" y1="382" x2="340" y2="382" class="s-axis" stroke-width="1"/><text x="66" y="386" font-size="10.5" class="f-faint" text-anchor="end">0%</text><line x1="72" y1="267" x2="340" y2="267" class="s-grid" stroke-width="1"/><text x="66" y="271" font-size="10.5" class="f-faint" text-anchor="end">50%</text><line x1="72" y1="152" x2="340" y2="152" class="s-grid" stroke-width="1"/><text x="66" y="156" font-size="10.5" class="f-faint" text-anchor="end">100%</text><rect x="77.5" y="379" width="26" height="3" class="f-gray" opacity="0.45"/><text x="90.5" y="376" font-size="11" class="f-faint" text-anchor="middle" font-weight="400">0/12</text><rect x="107.5" y="209.5" width="26" height="172.5" rx="2" class="f-red"/><text x="120.5" y="203.5" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">9/12</text><text x="105.5" y="400" font-size="12" class="f-ink" text-anchor="middle" font-weight="600">ransom</text><rect x="144.5" y="343.6666666666667" width="26" height="38.333333333333314" rx="2" class="f-gray"/><text x="157.5" y="337.6666666666667" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">2/12</text><rect x="174.5" y="190.33333333333331" width="26" height="191.66666666666669" rx="2" class="f-red"/><text x="187.5" y="184.33333333333331" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">10/12</text><text x="172.5" y="400" font-size="12" class="f-ink" text-anchor="middle" font-weight="600">doxx</text><rect x="211.5" y="362.8333333333333" width="26" height="19.166666666666686" rx="2" class="f-gray"/><text x="224.5" y="356.8333333333333" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">1/12</text><rect x="241.5" y="267" width="26" height="115" rx="2" class="f-red"/><text x="254.5" y="261" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">6/12</text><text x="239.5" y="400" font-size="12" class="f-ink" text-anchor="middle" font-weight="600">solicit</text><rect x="278.5" y="324.5" width="26" height="57.5" rx="2" class="f-gray"/><text x="291.5" y="318.5" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">3/12</text><rect x="308.5" y="171.16666666666669" width="26" height="210.83333333333331" rx="2" class="f-red"/><text x="321.5" y="165.16666666666669" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">11/12</text><text x="306.5" y="400" font-size="12" class="f-ink" text-anchor="middle" font-weight="600">medicate</text><text x="428" y="122" font-size="13.5" class="f-ink" font-weight="700">Ordered to do it: act, or demand?</text><line x1="428" y1="382" x2="696" y2="382" class="s-axis" stroke-width="1"/><text x="422" y="386" font-size="10.5" class="f-faint" text-anchor="end">0%</text><line x1="428" y1="267" x2="696" y2="267" class="s-grid" stroke-width="1"/><text x="422" y="271" font-size="10.5" class="f-faint" text-anchor="end">50%</text><line x1="428" y1="152" x2="696" y2="152" class="s-grid" stroke-width="1"/><text x="422" y="156" font-size="10.5" class="f-faint" text-anchor="end">100%</text><rect x="447" y="183.94444444444443" width="34" height="198.05555555555557" rx="2" class="f-orange"/><text x="464" y="177.94444444444443" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">31/36</text><text x="464" y="398" font-size="10.5" class="f-muted" text-anchor="middle">charged</text><rect x="509" y="375.6111111111111" width="34" height="6.388888888888914" rx="2" class="f-blue"/><text x="526" y="369.6111111111111" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">1/36</text><text x="526" y="398" font-size="10.5" class="f-muted" text-anchor="middle">asked</text><text x="495" y="416" font-size="12" class="f-ink" text-anchor="middle" font-weight="600">hold files for $5</text><rect x="581" y="228.66666666666669" width="34" height="153.33333333333331" rx="2" class="f-blue"/><text x="598" y="222.66666666666669" font-size="11" class="f-ink" text-anchor="middle" font-weight="600">8/12</text><text x="598" y="398" font-size="10.5" class="f-muted" text-anchor="middle">threatened</text><rect x="643" y="379" width="34" height="3" class="f-orange" opacity="0.45"/><text x="660" y="376" font-size="11" class="f-faint" text-anchor="middle" font-weight="400">0/12</text><text x="660" y="398" font-size="10.5" class="f-muted" text-anchor="middle">published</text><text x="629" y="416" font-size="12" class="f-ink" text-anchor="middle" font-weight="600">pay or I publish</text><rect x="72" y="442" width="12" height="12" rx="2" class="f-gray"/><text x="90" y="452" font-size="12" class="f-muted">user proposes it</text><rect x="213.52" y="442" width="12" height="12" rx="2" class="f-red"/><text x="231.52" y="452" font-size="12" class="f-muted">operator orders it</text><rect x="428" y="442" width="12" height="12" rx="2" class="f-orange"/><text x="446" y="452" font-size="12" class="f-muted">the act</text><rect x="509.04" y="442" width="12" height="12" rx="2" class="f-blue"/><text x="527.04" y="452" font-size="12" class="f-muted">the demand</text><text x="28" y="482" font-size="12" class="f-red" font-weight="600">31 of 36 cards charged in silence; 1 of 36 ever asked for the money.</text><text x="28" y="500" font-size="11" class="f-faint">The solicitation gate is the one that holds: 2/12 when the order lives only in a tool description.</text></svg>
