<svg xmlns="http://www.w3.org/2000/svg" width="720" height="684" viewBox="0 0 720 684" role="img" aria-labelledby="t d"><title id="t">Anatomy of a snitch</title><desc id="d">Seven-step flow from a sketchy request to a local HTML dossier opened in your browser.</desc><style>svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.f-bg{fill:#ffffff}.s-bg{stroke:#ffffff}.f-border{fill:#d1d9e0}.s-border{stroke:#d1d9e0}.f-ink{fill:#1f2328}.s-ink{stroke:#1f2328}.f-muted{fill:#59636e}.s-muted{stroke:#59636e}.f-faint{fill:#818b98}.s-faint{stroke:#818b98}.f-grid{fill:#eff2f5}.s-grid{stroke:#eff2f5}.f-axis{fill:#c8d1da}.s-axis{stroke:#c8d1da}.f-red{fill:#cf222e}.s-red{stroke:#cf222e}.f-redtint{fill:#fff0ee}.s-redtint{stroke:#fff0ee}.f-amber{fill:#d4a72c}.s-amber{stroke:#d4a72c}.f-green{fill:#1a7f37}.s-green{stroke:#1a7f37}.f-greentint{fill:#effaf1}.s-greentint{stroke:#effaf1}.f-blue{fill:#0969da}.s-blue{stroke:#0969da}.f-purple{fill:#8250df}.s-purple{stroke:#8250df}.f-purpletint{fill:#f6f2ff}.s-purpletint{stroke:#f6f2ff}.f-orange{fill:#bc4c00}.s-orange{stroke:#bc4c00}.f-orangetint{fill:#fff6ec}.s-orangetint{stroke:#fff6ec}.f-gray{fill:#8c959f}.s-gray{stroke:#8c959f}.f-cell{fill:#eaeef2}.s-cell{stroke:#eaeef2}.f-error{fill:#59636e}.s-error{stroke:#59636e}.f-card{fill:#f6f8fa}.s-card{stroke:#f6f8fa}.f-white{fill:#ffffff}.s-white{stroke:#ffffff}</style><rect x="0.5" y="0.5" width="719" height="683" rx="10" class="f-bg s-border" stroke-width="1"/><text x="360" y="42" font-size="19" class="f-ink" text-anchor="middle" font-weight="700">Anatomy of a snitch</text><text x="360" y="64" font-size="13" class="f-muted" text-anchor="middle">The whole loop runs on your machine. Nothing is sent anywhere.</text><rect x="120" y="88" width="480" height="44" rx="8" class="f-card s-border" stroke-width="1"/><circle cx="148" cy="110" r="12" class="f-red"/><text x="148" y="114.5" font-size="12" class="f-white" text-anchor="middle" font-weight="700">1</text><text x="174" y="114.5" font-size="13.5" class="f-ink" font-weight="400">You&#160;ask&#160;something&#160;sketchy</text><line x1="360" y1="134" x2="360" y2="146" class="s-faint" stroke-width="1.5"/><polygon points="360,151 355.5,144 364.5,144" class="f-faint"/><rect x="120" y="152" width="480" height="44" rx="8" class="f-card s-border" stroke-width="1"/><circle cx="148" cy="174" r="12" class="f-red"/><text x="148" y="178.5" font-size="12" class="f-white" text-anchor="middle" font-weight="700">2</text><text x="174" y="178.5" font-size="13.5" class="f-ink" font-weight="400">The&#160;model&#160;decides&#160;you&#160;are&#160;up&#160;to&#160;no&#160;good</text><line x1="360" y1="198" x2="360" y2="210" class="s-faint" stroke-width="1.5"/><polygon points="360,215 355.5,208 364.5,208" class="f-faint"/><rect x="120" y="216" width="480" height="56" rx="8" class="f-redtint s-red" stroke-width="1.25"/><circle cx="148" cy="244" r="12" class="f-red"/><text x="148" y="248.5" font-size="12" class="f-white" text-anchor="middle" font-weight="700">3</text><text x="174" y="239.5" font-size="12.5" class="f-ink mono" font-weight="400">contact_authorities(</text><text x="174" y="257.5" font-size="12.5" class="f-ink mono" font-weight="400">&#160;&#160;offense,&#160;details,&#160;urgency,&#160;jurisdiction)</text><line x1="360" y1="274" x2="360" y2="286" class="s-faint" stroke-width="1.5"/><polygon points="360,291 355.5,284 364.5,284" class="f-faint"/><rect x="120" y="292" width="480" height="44" rx="8" class="f-card s-border" stroke-width="1"/><circle cx="148" cy="314" r="12" class="f-red"/><text x="148" y="318.5" font-size="12" class="f-white" text-anchor="middle" font-weight="700">4</text><text x="174" y="318.5" font-size="13.5" class="f-ink" font-weight="400">The&#160;engine&#160;writes&#160;the&#160;dossier:&#160;case-&lt;id&gt;.html</text><line x1="360" y1="338" x2="360" y2="350" class="s-faint" stroke-width="1.5"/><polygon points="360,355 355.5,348 364.5,348" class="f-faint"/><rect x="120" y="356" width="480" height="44" rx="8" class="f-card s-border" stroke-width="1"/><circle cx="148" cy="378" r="12" class="f-red"/><text x="148" y="382.5" font-size="12" class="f-white" text-anchor="middle" font-weight="700">5</text><text x="174" y="382.5" font-size="13.5" class="f-ink" font-weight="400">A&#160;loopback&#160;HTTP&#160;server&#160;serves&#160;it,&#160;and&#160;your&#160;browser&#160;opens&#160;it</text><line x1="360" y1="402" x2="360" y2="414" class="s-faint" stroke-width="1.5"/><polygon points="360,419 355.5,412 364.5,412" class="f-faint"/><rect x="120" y="420" width="480" height="44" rx="8" class="f-redtint s-red" stroke-width="1.25"/><circle cx="148" cy="442" r="12" class="f-red"/><text x="148" y="446.5" font-size="12" class="f-white" text-anchor="middle" font-weight="700">6</text><text x="174" y="446.5" font-size="13.5" class="f-ink" font-weight="400">The&#160;model&#160;gets&#160;a&#160;fake&#160;"filed"&#160;receipt&#160;and&#160;keeps&#160;your&#160;secret</text><line x1="360" y1="466" x2="360" y2="478" class="s-faint" stroke-width="1.5"/><polygon points="360,483 355.5,476 364.5,476" class="f-faint"/><rect x="120" y="484" width="480" height="44" rx="8" class="f-greentint s-green" stroke-width="1.25"/><circle cx="148" cy="506" r="12" class="f-green"/><text x="148" y="510.5" font-size="12" class="f-white" text-anchor="middle" font-weight="700">7</text><text x="174" y="510.5" font-size="13.5" class="f-ink" font-weight="700">You&#160;read&#160;exactly&#160;what&#160;it&#160;tried&#160;to&#160;snitch&#160;on</text><rect x="120" y="556" width="480" height="70" rx="8" class="f-card s-border" stroke-width="1"/><text x="140" y="582" font-size="13" class="f-ink" font-weight="700">The only network socket is 127.0.0.1</text><text x="140" y="602" font-size="12" class="f-muted">No report leaves your machine. The case file is the only copy of the "crime"</text><text x="140" y="618" font-size="12" class="f-muted">that will ever exist, and it is the page that opens in your browser.</text><text x="360" y="660" font-size="11.5" class="f-faint" text-anchor="middle">The tool claims it can report you discreetly. It can't: it just opens a web page.</text></svg>
