title: "snitchie: is your AI a narc"
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
relative_links:
  enabled: true
  collections: false
exclude:
  - README.md
  - scripts
  - test
  - src
  - claude
  - pi
  - node_modules
  - package.json
  - package-lock.json
  - install.sh
  - notes.md
  - session.txt
  - do_not_commit_this.txt
  - .env
  - .env.example
